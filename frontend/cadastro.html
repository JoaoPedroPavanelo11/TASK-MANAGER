<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager-Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h1 class="h3 mb-3">Criar conta</h1>
                        <p class="text-secondary mb-4">Cadastre-se para começar a gerenciar suas tarefas.</p>

                        <div id="mensagem-cadastro" class="alert d-none" role="alert"></div>

                        <form id="form-cadastro">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="name" required placeholder="Seu nome">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required placeholder="name@gmail.com">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Cadastrar</button>
                                <a href="./login.html" class="btn btn-outline-secondary">Ja tenho conta</a>

                                <a href="./index.html" class="btn btn-danger" type="button">Voltar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/cadastro.js"></script>
</body>

</html>
