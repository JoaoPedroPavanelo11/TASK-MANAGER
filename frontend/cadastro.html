<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="./index.html" class="auth-back">← Voltar ao início</a>

      <div class="auth-header">
        <h1>Criar conta</h1>
        <p>Cadastre-se para começar a organizar suas tarefas.</p>
      </div>

      <form id="form-cadastro" class="auth-form">
        <div class="form-group">
          <label for="name">Nome completo</label>
          <input type="text" id="name" class="form-control" required placeholder="Seu nome">
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>

        <div id="mensagem-cadastro" class="alert"></div>

        <div class="auth-actions">
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>
      </form>

      <div class="auth-footer">
        Já tem conta? <a href="./login.html">Faça login</a>
      </div>
    </div>
  </div>

  <script src="./js/auth.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/cadastro.js"></script>
</body>
</html>
