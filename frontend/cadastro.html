<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Task Manager</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 3rem 2rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    
    .auth-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 2.5rem;
      width: 100%;
      border: 1px solid var(--border);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .auth-header h1 {
      font-size: 1.75rem;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    
    .auth-header p {
      color: var(--text-light);
      font-size: 1rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
    }
    
    .auth-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .auth-actions .btn {
      flex: 1;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-light);
      font-size: 0.95rem;
    }
    
    .message {
      padding: 1rem;
      border-radius: var(--radius-sm);
      margin: 1.5rem 0;
      display: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="card">
      <div class="auth-header">
        <h1>Criar Conta</h1>
        <p>Cadastre-se para começar a gerenciar suas tarefas</p>
      </div>
      
      <form id="form-cadastro">
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input type="text" id="name" class="form-control" required placeholder="Seu nome">
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required placeholder="seu@email.com">
        </div>
        
        <div class="form-group">
          <label for="password">Senha (mínimo 6 caracteres)</label>
          <input type="password" id="password" class="form-control" required minlength="6">
        </div>
        
        <div id="mensagem-cadastro" class="message"></div>
        
        <div class="auth-actions">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Cadastrar</button>
          <a href="./login.html" class="btn" style="flex: 1; background: var(--surface); border: 1px solid var(--border);">Já tenho conta</a>
        </div>
      </form>
    </div>
  </div>
  
  <script src="./js/api.js"></script>
  <script src="./js/cadastro.js"></script>
</body>
</html>
