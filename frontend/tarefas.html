<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tarefas.css">
</head>
<body>
  <div class="tasks-page">
    <div class="container">
      <header class="tasks-header">
        <div>
          <h1>Minhas Tarefas</h1>
          <p>Adicione, edite e acompanhe suas tarefas.</p>
        </div>
        <button id="btn-sair" class="btn btn-danger btn-sm">Sair</button>
      </header>

      <div class="tasks-layout">
        <aside class="panel">
          <h2 class="panel-title" id="form-titulo">Nova Tarefa</h2>
          <form id="form-tarefa">
            <input type="hidden" id="tarefa-id" value="">

            <div class="form-group">
              <label for="titulo">Título</label>
              <input type="text" id="titulo" class="form-control" required placeholder="Ex: Estudar Node.js">
            </div>

            <div class="form-group">
              <label for="descricao">Descrição</label>
              <textarea id="descricao" class="form-control" rows="3" required placeholder="Descreva a tarefa..."></textarea>
            </div>

            <div class="form-group">
              <label for="status">Status</label>
              <select id="status" class="form-control">
                <option value="PENDENTE">Pendente</option>
                <option value="EM_ANDAMENTO">Em andamento</option>
                <option value="CONCLUIDA">Concluída</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="btn-salvar">Adicionar</button>
              <button type="button" class="btn btn-ghost btn-sm" id="btn-cancelar" style="display: none;">Cancelar</button>
            </div>
          </form>
        </aside>

        <section class="panel">
          <h2 class="panel-title">Suas tarefas</h2>
          <p class="task-count" id="task-count"></p>
          <div id="lista-tarefas" class="task-list"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="./js/auth.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/tarefas.js"></script>
</body>
</html>
