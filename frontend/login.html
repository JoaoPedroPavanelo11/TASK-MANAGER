<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager-Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h1 class="h3 mb-3">Login</h1>
                        <p class="text-secondary mb-4">Entre na sua conta para gerenciar suas tarefas!</p>

                        <form id="form-login">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-label" id="email" required placeholder="name@gmail.com">
                            </div>

                            <div class="mb-3">
                                <label for="passowrd" class="form-label">Senha</label>
                                <input type="password" class="form-label" id="passowrd" required>
                            </div>

                            <div class="d-grid gap-2 col-6 mx-auto">
                                <button type="submit" class="btn- btn-primary" type="button">Entrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="./js/login.js"></script>
</body>

</html>
