<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .hero {
      text-align: center;
      padding: 6rem 0 4rem;
    }
    
    .hero h1 {
      font-size: 2.5rem;

    }

      color: var(--text-light);
      max-width: 600px;
      margin: 0 auto 2rem;
    }

      display: flex;
      gap: 1rem;
      justify-content: center;
    }

<body>
  <div class="container">
    <div class="hero">
      <h1>Bem-vindo ao Task Manager</h1>
      <p>Organize suas tarefas de forma simples e eficiente</p>
      <div class="cta-buttons">
        <a href="./login.html" class="btn btn-primary">Entrar</a>
        <a href="./cadastro.html" class="btn" style="background: var(--secondary); color: white;">Cadastrar</a>
      </div>
    </div>
  </div>

</html>
